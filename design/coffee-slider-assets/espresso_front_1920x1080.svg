<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="esp_shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2A1810" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2A1810" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="esp_cup_body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E3D9CC"/>
      <stop offset="18%" stop-color="#FBF7F2"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="82%" stop-color="#F1E9DF"/>
      <stop offset="100%" stop-color="#D9CCBB"/>
    </linearGradient>
    <linearGradient id="esp_cup_inner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C9BCA9"/>
      <stop offset="100%" stop-color="#E8DFD2"/>
    </linearGradient>
    <radialGradient id="esp_crema" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#C89B5C"/>
      <stop offset="55%" stop-color="#A9714B"/>
      <stop offset="100%" stop-color="#6B4226"/>
    </radialGradient>
    <linearGradient id="esp_saucer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1E9DF"/>
      <stop offset="100%" stop-color="#DED2C2"/>
    </linearGradient>
    <linearGradient id="esp_handle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF7F2"/>
      <stop offset="50%" stop-color="#E3D9CC"/>
      <stop offset="100%" stop-color="#C9BCA9"/>
    </linearGradient>
    <filter id="esp_soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="960" cy="860" rx="330" ry="55" fill="url(#esp_shadow)"/>

  <!-- steam -->
  <g opacity="0.55" filter="url(#esp_soft)">
    <path d="M900 430 C880 390 920 360 900 320 C885 290 915 260 905 230" stroke="#FFFFFF" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M1010 430 C1030 385 995 355 1015 315 C1030 285 1000 255 1015 225" stroke="#FFFFFF" stroke-width="14" fill="none" stroke-linecap="round"/>
  </g>

  <!-- saucer -->
  <ellipse cx="960" cy="800" rx="300" ry="46" fill="url(#esp_saucer)" stroke="#D9CCBB" stroke-width="2"/>
  <ellipse cx="960" cy="794" rx="260" ry="34" fill="#EDE3D5"/>

  <!-- handle -->
  <path d="M1140 560 C1230 560 1235 690 1150 705 L1140 665 C1195 655 1192 600 1140 600 Z" fill="url(#esp_handle)" stroke="#D9CCBB" stroke-width="2"/>

  <!-- cup body -->
  <path d="M790 520 L1130 520 L1095 730 C1090 762 950 780 830 762 C812 758 800 745 796 730 Z" fill="url(#esp_cup_body)" stroke="#D9CCBB" stroke-width="2"/>

  <!-- cup rim / coffee opening -->
  <ellipse cx="960" cy="522" rx="170" ry="42" fill="url(#esp_cup_inner)"/>
  <ellipse cx="960" cy="516" rx="160" ry="36" fill="url(#esp_crema)"/>
  <ellipse cx="905" cy="504" rx="55" ry="14" fill="#E9C48A" opacity="0.55"/>

  <!-- highlight on cup -->
  <path d="M830 550 C822 610 826 680 850 730" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" opacity="0.55" fill="none"/>

  <!-- reflection under saucer -->
  <ellipse cx="960" cy="838" rx="230" ry="16" fill="#3B2419" opacity="0.10"/>
</svg>
